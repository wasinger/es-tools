name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        es-version: ['6.8.23', '7.17.29', '8.19.23', '9.5.5']
        # Match the official PHP client to the server major version.
        # Unique host ports also allow concurrent local act jobs.
        include:
          - es-version: '6.8.23'
            es-client: '^6.8.4'
            es-port-prefix: '196'
          - es-version: '7.17.29'
            es-client: '^7.17'
            es-port-prefix: '197'
          - es-version: '8.19.23'
            es-client: '^8.19'
            es-port-prefix: '198'
          - es-version: '9.5.5'
            es-client: '^9.0'
            es-port-prefix: '199'
          - php-version: '8.3'
            php-port-suffix: '83'
          - php-version: '8.4'
            php-port-suffix: '84'
          - php-version: '8.5'
            php-port-suffix: '85'

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.es-version }}
        env:
          discovery.type: single-node
          action.destructive_requires_name: 'false'
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - ${{ matrix.es-port-prefix }}${{ matrix.php-port-suffix }}:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Only needed when running locally with nektos/act behind an HTTP proxy:
    # setup-php downloads files using "sudo curl", and sudo drops the proxy environment variables by default
    - name: Keep proxy environment variables for sudo (act only)
      if: ${{ env.ACT }}
      run: echo 'Defaults env_keep += "http_proxy https_proxy no_proxy HTTP_PROXY HTTPS_PROXY NO_PROXY"' | sudo tee /etc/sudoers.d/proxy

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, json, curl
        coverage: none
        tools: composer:v2

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer packages
      # Local act runs do not need the GitHub cache service.
      if: ${{ !env.ACT }}
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-es-${{ matrix.es-version }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-es-${{ matrix.es-version }}-

    # composer.lock is not part of the repository, so this resolves the newest
    # dependencies (incl. PHPUnit version) compatible with the PHP version of the matrix
    - name: Install Composer dependencies
      run: |
        composer require --no-update --no-interaction 'elasticsearch/elasticsearch:${{ matrix.es-client }}'
        composer update --prefer-dist --no-progress --no-interaction

    # Where the service container is reachable depends on the environment:
    # - GitHub hosted runners and nektos/act (job container in host network): on localhost via the mapped host port
    # - job container in the same docker network as the service: via the service name
    - name: Wait for Elasticsearch
      env:
        MAPPED_PORT: ${{ job.services.elasticsearch.ports['9200'] }}
      run: |
        candidates="localhost:${{ matrix.es-port-prefix }}${{ matrix.php-port-suffix }}"
        [ -n "$MAPPED_PORT" ] && candidates="$candidates localhost:$MAPPED_PORT"
        candidates="$candidates elasticsearch:9200"
        echo "Trying Elasticsearch at: $candidates"
        for i in $(seq 1 36); do
          for host in $candidates; do
            if curl -fs --noproxy '*' "http://$host/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null; then
              echo "Elasticsearch is available at $host"
              echo "ES_HOST=$host" >> $GITHUB_ENV
              curl -s --noproxy '*' "http://$host"
              exit 0
            fi
          done
          echo "Still waiting for Elasticsearch ..."
          sleep 5
        done
        echo "Elasticsearch did not become available"
        exit 1

    - name: Run tests
      run: vendor/bin/phpunit
